<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toxicity Demo</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: rgba(255, 255, 255, 0.78);
        --card2: rgba(255, 255, 255, 0.92);
        --text: #1d1d1f;
        --muted: rgba(29, 29, 31, 0.62);
        --border: rgba(0, 0, 0, 0.08);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        --shadow2: 0 10px 30px rgba(0, 0, 0, 0.06);
        --blue: #007aff;
        --red: #ff3b30;
        --green: #34c759;
      }

      html { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background-attachment: fixed;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background-image: radial-gradient(1200px 600px at 20% 10%, rgba(0, 122, 255, 0.14), rgba(0, 122, 255, 0) 60%),
                          radial-gradient(1000px 600px at 80% 0%, rgba(52, 199, 89, 0.10), rgba(52, 199, 89, 0) 60%);
        background-color: var(--bg);
      }

      .container { max-width: 1280px; margin: 0 auto; padding: 28px 18px 60px; }
      .header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0; font-weight: 700; }
      .sub { margin-top: 10px; color: var(--muted); font-size: 13px; }
      code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 8px; }

      .card {
        margin-top: 18px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .card-inner { padding: 16px 16px 14px; background: linear-gradient(to bottom, rgba(255,255,255,0.92), rgba(255,255,255,0.72)); }

      textarea, input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border-radius: 14px;
        border: 1px solid var(--border);
        outline: none;
        background: var(--card2);
        color: var(--text);
        font-size: 14px;
        line-height: 1.45;
      }
      textarea {
        min-height: 120px;
        padding: 12px 12px;
        resize: vertical;
      }
      input[type="text"] {
        padding: 10px 12px;
        margin-top: 8px;
      }
      textarea:focus, input[type="text"]:focus { border-color: rgba(0,122,255,0.35); box-shadow: 0 0 0 4px rgba(0,122,255,0.12); }

      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
      .row > * { margin: 0; }

      details { margin-top: 10px; }
      details summary { cursor: pointer; color: var(--muted); font-size: 12px; }

      label { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
      select, input[type="number"] {
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card2);
        padding: 8px 10px;
        outline: none;
        color: var(--text);
      }
      select:focus, input[type="number"]:focus { border-color: rgba(0,122,255,0.35); box-shadow: 0 0 0 4px rgba(0,122,255,0.12); }

      .btn {
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.86);
        padding: 9px 12px;
        cursor: pointer;
        color: var(--text);
        box-shadow: var(--shadow2);
        transition: transform 0.06s ease, background 0.15s ease, opacity 0.15s ease;
      }
      .btn:active { transform: scale(0.98); }
      .btn.primary {
        background: linear-gradient(180deg, rgba(0,122,255,0.95), rgba(0,122,255,0.82));
        border-color: rgba(0,122,255,0.35);
        color: white;
      }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      .meta { margin-top: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .chip { font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.7); border: 1px solid var(--border); padding: 6px 10px; border-radius: 999px; }
      .err { color: var(--red); font-weight: 600; }

      table { width: 100%; border-collapse: collapse; margin-top: 14px; }
      th, td { border-bottom: 1px solid rgba(0,0,0,0.08); padding: 10px 8px; vertical-align: top; }
      th { color: rgba(29,29,31,0.7); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      td { font-size: 14px; }

      .tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
      .tag.bad { background: rgba(255,59,48,0.12); color: #b00020; }
      .tag.good { background: rgba(52,199,89,0.14); color: #1b5e20; }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(245,245,247,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .overlay-card {
        width: min(520px, calc(100% - 40px));
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 18px 18px 16px;
      }
      .overlay-title { font-size: 16px; font-weight: 700; margin: 0; }
      .overlay-sub { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.4; }
      .spinner {
        margin-top: 14px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid rgba(0,0,0,0.08);
        border-top-color: rgba(0,122,255,0.9);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <div class="overlay-title" id="overlayTitle">加载模型中…</div>
        <div class="overlay-sub" id="overlaySub">首次加载可能较慢，请稍候。</div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="overlay-sub err" id="overlayErr" style="display:none;margin-top:10px;"></div>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h1>文本含毒检测</h1>
        <div style="display:flex; gap:10px; align-items:center;">
          <div class="chip" id="statusChip">状态：初始化</div>
          <a class="btn" href="/agent">Agent 对话</a>
        </div>
      </div>
      <div class="sub">多条文本用 <code>\,</code> 分隔；或使用换行分隔。</div>

      <div class="card">
        <div class="card-inner">
          <textarea id="input" placeholder="输入文本。例如：&#10;这是一条正常文本\\, 你这个傻X"></textarea>
          
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <div style="flex: 1; border-radius: 14px; border: 1px dashed var(--border); padding: 12px; background: var(--card2); position: relative;">
              <label style="cursor: pointer; display: block;">
                <span style="display:inline-block; width:80px; font-weight:bold;">图片上传:</span> 
                <input type="file" id="imageUpload" accept="image/*" />
                <div style="font-size: 11px; margin-top: 4px; color: var(--muted); margin-left: 84px;">(格式需为合法图片，禁止假后缀名)</div>
              </label>
              <button id="clearImage" class="btn" style="position: absolute; right: 12px; top: 12px; padding: 4px 10px; font-size: 12px; display: none; background: rgba(255,59,48,0.1); color: var(--red); border-color: rgba(255,59,48,0.2);">删除</button>
            </div>
            
            <div style="flex: 1; border-radius: 14px; border: 1px dashed var(--border); padding: 12px; background: var(--card2); position: relative;">
              <label style="cursor: pointer; display: block;">
                <span style="display:inline-block; width:80px; font-weight:bold;">音频上传:</span> 
                <input type="file" id="audioUpload" accept="audio/*" />
                <div style="font-size: 11px; margin-top: 4px; color: var(--muted); margin-left: 84px;">(格式需为合法音频，如 .wav / .mp3)</div>
              </label>
              <button id="clearAudio" class="btn" style="position: absolute; right: 12px; top: 12px; padding: 4px 10px; font-size: 12px; display: none; background: rgba(255,59,48,0.1); color: var(--red); border-color: rgba(255,59,48,0.2);">删除</button>
            </div>
          </div>

          <div class="row">
            <label>
              检测模式
              <select id="mode">
                <option value="baseline">baseline（仅模型）</option>
                <option value="ocr_asr" selected>OCR/ASR（文本增强）</option>
                <option value="ocr_asr_rag">OCR/ASR + RAG</option>
              </select>
            </label>

            <label>
              <input type="checkbox" id="ragEnabled" /> 启用 RAG
            </label>

            <label>
              <input type="checkbox" id="ragAugment" checked /> 追加检索证据到模型输入
            </label>
          </div>

          <details>
            <summary>高级设置（检索与融合参数）</summary>
            <div class="row">
              <label>
                RAG TopK
                <input id="ragTopK" type="number" min="1" max="20" step="1" value="5" />
              </label>
              <label>
                RAG MinScore
                <input id="ragMinScore" type="number" min="0" max="1" step="0.01" value="0" />
              </label>
              <label>
                RAG 上下文最大字符
                <input id="ragContextMaxChars" type="number" min="120" max="2000" step="10" value="480" />
              </label>
              <label>
                <input type="checkbox" id="ragWithRules" checked /> 规则命中参与
              </label>
            </div>
            <div class="row">
              <label>
                Fusion 阈值
                <input id="fusionThreshold" type="number" min="0" max="1" step="0.01" value="0.5" />
              </label>
              <label>
                w_model
                <input id="fusionModel" type="number" min="0" max="1" step="0.01" value="0.6" />
              </label>
              <label>
                w_bm25
                <input id="fusionBm25" type="number" min="0" max="1" step="0.01" value="0.2" />
              </label>
              <label>
                w_vector
                <input id="fusionVector" type="number" min="0" max="1" step="0.01" value="0.15" />
              </label>
              <label>
                w_rule
                <input id="fusionRule" type="number" min="0" max="1" step="0.01" value="0.05" />
              </label>
            </div>
          </details>

          <div class="row">
            <label>
              阈值模式
              <select id="thresholdMode">
                <option value="calibrated">calibrated（优先使用run里保存的阈值）</option>
                <option value="fixed">fixed（使用自定义阈值）</option>
                <option value="argmax">argmax（等价阈值0.5）</option>
              </select>
            </label>

            <label>
              自定义阈值
              <input id="threshold" type="number" min="0" max="1" step="0.01" value="0.5" />
            </label>

            <button class="btn primary" id="run">检测</button>
            <button class="btn" id="clear">清空</button>
          </div>

          <div class="meta">
            <div class="chip" id="meta"></div>
            <div class="chip err" id="err"></div>
          </div>

          <div id="tableContainer" style="display:none; margin-top: 14px; max-height: 480px; overflow-y: auto;">
            <table id="table" style="margin-top: 0;">
              <thead>
                <tr>
                  <th style="width:52px;">#</th>
                  <th>模态 (输入内容)</th>
                  <th style="width:120px;">p(toxic)</th>
                  <th style="width:110px;">预测</th>
                  <th style="width:200px;">检测信息(耗时)</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      function splitTexts(raw) {
        const s = (raw || "").trim();
        if (!s) return [];
        if (s.includes("\\,")) {
          return s.split("\\,").map(x => x.trim());
        }
        if (s.includes("\n")) {
          return s.split(/\n+/).map(x => x.trim());
        }
        return s.split(",").map(x => x.trim());
      }

      function esc(s) {
        return (s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }

      function setOverlay(show, title, sub, err) {
        const el = document.getElementById("overlay");
        const titleEl = document.getElementById("overlayTitle");
        const subEl = document.getElementById("overlaySub");
        const errEl = document.getElementById("overlayErr");
        el.style.display = show ? "flex" : "none";
        if (title) titleEl.textContent = title;
        if (sub) subEl.textContent = sub;
        if (err) {
          errEl.style.display = "";
          errEl.textContent = err;
        } else {
          errEl.style.display = "none";
          errEl.textContent = "";
        }
      }

      function setReady(ready) {
        document.getElementById("run").disabled = !ready;
        document.getElementById("thresholdMode").disabled = !ready;
        document.getElementById("threshold").disabled = !ready;
        document.getElementById("mode").disabled = !ready;
        document.getElementById("ragEnabled").disabled = !ready;
        document.getElementById("ragAugment").disabled = !ready;
        document.getElementById("ragTopK").disabled = !ready;
        document.getElementById("ragMinScore").disabled = !ready;
        document.getElementById("ragContextMaxChars").disabled = !ready;
        document.getElementById("ragWithRules").disabled = !ready;
        document.getElementById("fusionThreshold").disabled = !ready;
        document.getElementById("fusionModel").disabled = !ready;
        document.getElementById("fusionBm25").disabled = !ready;
        document.getElementById("fusionVector").disabled = !ready;
        document.getElementById("fusionRule").disabled = !ready;
      }

      async function refreshStatus() {
        const r = await fetch("/api/status", { method: "GET" });
        const st = await r.json();
        const chip = document.getElementById("statusChip");
        if (st.status === "ready") {
          chip.textContent = "状态：就绪";
          setReady(true);
          setOverlay(false);
          return true;
        }
        if (st.status === "error") {
          chip.textContent = "状态：加载失败";
          setReady(false);
          setOverlay(true, "模型加载失败", "请检查 run_dir 与权重路径是否正确。", st.error || "未知错误");
          return false;
        }
        chip.textContent = "状态：加载中";
        setReady(false);
        setOverlay(true, "加载模型中…", "首次加载可能较慢，请稍候。", null);
        return null;
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
        });
      }

      let requestCounter = 0;
      let totalRows = 0;

      async function predict() {
        const input = document.getElementById("input").value;
        const imgFile = document.getElementById("imageUpload").files[0];
        const audFile = document.getElementById("audioUpload").files[0];
        
        let image_b64 = "";
        let audio_b64 = "";
        if (imgFile) image_b64 = await fileToBase64(imgFile);
        if (audFile) audio_b64 = await fileToBase64(audFile);

        const texts = splitTexts(input);
        
        const thresholdMode = document.getElementById("thresholdMode").value;
        const threshold = parseFloat(document.getElementById("threshold").value || "0.5");

        const mode = document.getElementById("mode").value;
        const ragEnabled = document.getElementById("ragEnabled").checked;
        const ragAugment = document.getElementById("ragAugment").checked;
        const ragTopK = parseInt(document.getElementById("ragTopK").value || "5", 10);
        const ragMinScore = parseFloat(document.getElementById("ragMinScore").value || "0");
        const ragContextMaxChars = parseInt(document.getElementById("ragContextMaxChars").value || "480", 10);
        const ragWithRules = document.getElementById("ragWithRules").checked;
        const fusionThreshold = parseFloat(document.getElementById("fusionThreshold").value || "0.5");
        const fusion = {
          model: parseFloat(document.getElementById("fusionModel").value || "0.6"),
          bm25: parseFloat(document.getElementById("fusionBm25").value || "0.2"),
          vector: parseFloat(document.getElementById("fusionVector").value || "0.15"),
          rule: parseFloat(document.getElementById("fusionRule").value || "0.05")
        };

        document.getElementById("err").textContent = "";

        if (texts.length === 0 && !image_b64 && !audio_b64) {
            document.getElementById("err").textContent = "请输入至少一种模态数据。";
            return;
        }

        const numInferences = Math.max(texts.length, image_b64 ? 1 : 0, audio_b64 ? 1 : 0);
        document.getElementById("tableContainer").style.display = "";
        const tb = document.getElementById("tbody");
        
        const reqId = ++requestCounter;
        const rowIds = [];
        for (let i = 0; i < numInferences; i++) {
            totalRows++;
            const tr = document.createElement("tr");
            const rowId = `row-${reqId}-${i}`;
            rowIds.push({ id: rowId, index: totalRows });
            tr.id = rowId;
            
            const tText = texts[i] || "";
            const hasImg = i === 0 && !!image_b64;
            const hasAud = i === 0 && !!audio_b64;
            
            let modalities = [];
            if (tText) modalities.push("文本");
            if (hasImg) modalities.push("图片");
            if (hasAud) modalities.push("音频");
            
            let displayContent = modalities.join(" + ");
            if (tText) displayContent += `<br/><span style="color:var(--muted);font-size:12px;">"${esc(tText)}"</span>`;
            
            tr.innerHTML =
              `<td>${totalRows}</td>` +
              `<td>${displayContent}</td>` +
              `<td id="score-${rowId}" style="color:var(--muted)">正在检测中...</td>` +
              `<td id="pred-${rowId}">-</td>` +
              `<td id="info-${rowId}">-</td>`;
            tb.appendChild(tr);
        }

        try {
            const resp = await fetch("/api/predict", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                texts,
                image_b64,
                audio_b64,
                threshold_mode: thresholdMode,
                threshold,
                mode,
                rag_enabled: ragEnabled,
                rag_augment_input: ragAugment,
                rag_top_k: ragTopK,
                rag_min_score: ragMinScore,
                rag_context_max_chars: ragContextMaxChars,
                rag_with_rules: ragWithRules,
                fusion_threshold: fusionThreshold,
                fusion
              })
            });
            const data = await resp.json();
            if (!resp.ok) {
              if (resp.status === 503) await refreshStatus();
              throw new Error(data && data.error ? data.error : "请求失败");
            }

            const metaParts = [];
            if (data.mode) metaParts.push(`mode=${data.mode}`);
            if (typeof data.rag_enabled === "boolean") metaParts.push(`rag=${data.rag_enabled ? "on" : "off"}`);
            if (data.rag_warning) metaParts.push(data.rag_warning);
            document.getElementById("meta").textContent = metaParts.join(" | ");

            // Remove global meta info since it's now in the table
            // document.getElementById("meta").textContent =
            //  `threshold_mode=${data.threshold_mode} threshold=${data.threshold} latency_ms=${data.latency_ms.toFixed(1)}`;

            const rows = data.results || [];
            for (let i = 0; i < rows.length; i++) {
              const r = rows[i];
              const rInfo = rowIds[i];
              if (!rInfo || !document.getElementById(rInfo.id)) continue;
              
              const predHTML = r.label === 1 ? `<span class="tag bad">toxic</span>` : `<span class="tag good">non-toxic</span>`;
              
              let modalities = [];
              if (r.has_text) modalities.push("文本");
              if (r.has_image) {
                let imgText = r.ocr_text ? ` <span style="font-size:12px;color:var(--muted);">(OCR识别: ${esc(r.ocr_text)})</span>` : "";
                modalities.push("图片" + imgText);
              }
              if (r.has_audio) {
                let audText = r.asr_text ? ` <span style="font-size:12px;color:var(--muted);">(语音识别: ${esc(r.asr_text)})</span>` : "";
                modalities.push("音频" + audText);
              }
              let displayContent = modalities.join(" + ");
              if (r.has_text) displayContent += `<br/><span style="color:var(--muted);font-size:12px;">"${esc(r.text)}"</span>`;

              const fusionInfo = r.fusion_score != null ? `fusion_score=${Number(r.fusion_score).toFixed(4)}<br/>` : "";
              const infoHTML = `<span style="font-size:12px;color:var(--muted)">threshold_mode=${data.threshold_mode}<br/>threshold=${Number(data.threshold).toFixed(6)}<br/>${fusionInfo}latency_ms=${Number(data.latency_ms).toFixed(1)}</span>`;

              const tr = document.getElementById(rInfo.id);
              tr.innerHTML =
                `<td>${rInfo.index}</td>` +
                `<td>${displayContent}</td>` +
                `<td>${Number(r.p_toxic).toFixed(6)}</td>` +
                `<td>${predHTML}</td>` +
                `<td>${infoHTML}</td>`;
            }
        } catch (e) {
            document.getElementById("err").textContent = e.message || String(e);
            for (const rInfo of rowIds) {
                const tr = document.getElementById(rInfo.id);
                if (tr) {
                    document.getElementById(`score-${rInfo.id}`).textContent = "请求失败";
                    document.getElementById(`score-${rInfo.id}`).style.color = "var(--red)";
                }
            }
        }
      }

      document.getElementById("run").addEventListener("click", () => {
        predict().catch(e => {
          document.getElementById("err").textContent = e && e.message ? e.message : String(e);
        });
      });

      const imgInput = document.getElementById("imageUpload");
      const audInput = document.getElementById("audioUpload");
      const clearImgBtn = document.getElementById("clearImage");
      const clearAudBtn = document.getElementById("clearAudio");
      const modeSelect = document.getElementById("mode");
      const ragToggle = document.getElementById("ragEnabled");

      modeSelect.addEventListener("change", () => {
        const mode = modeSelect.value;
        if (mode === "baseline") {
          ragToggle.checked = false;
        }
        if (mode === "ocr_asr_rag") {
          ragToggle.checked = true;
        }
      });
      modeSelect.dispatchEvent(new Event("change"));

      imgInput.addEventListener("change", () => {
        clearImgBtn.style.display = imgInput.files.length > 0 ? "block" : "none";
      });
      clearImgBtn.addEventListener("click", (e) => {
        e.preventDefault();
        imgInput.value = "";
        clearImgBtn.style.display = "none";
      });

      audInput.addEventListener("change", () => {
        clearAudBtn.style.display = audInput.files.length > 0 ? "block" : "none";
      });
      clearAudBtn.addEventListener("click", (e) => {
        e.preventDefault();
        audInput.value = "";
        clearAudBtn.style.display = "none";
      });

      document.getElementById("clear").addEventListener("click", () => {
        document.getElementById("input").value = "";
        imgInput.value = "";
        audInput.value = "";
        clearImgBtn.style.display = "none";
        clearAudBtn.style.display = "none";
        document.getElementById("mode").value = "ocr_asr";
        document.getElementById("ragEnabled").checked = false;
        document.getElementById("ragAugment").checked = true;
